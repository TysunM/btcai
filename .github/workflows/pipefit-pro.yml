name: PipeFit Pro

on:
  push:
    branches: ['**']
    paths:
      - 'pipefit-pro/**'
      - '.github/workflows/pipefit-pro.yml'
  pull_request:
    paths:
      - 'pipefit-pro/**'
      - '.github/workflows/pipefit-pro.yml'

defaults:
  run:
    working-directory: pipefit-pro

jobs:
  verify:
    name: Typecheck, test and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipefit-pro/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Bundle for web
        run: npx expo export --platform web --output-dir .ci-export
        env:
          EXPO_NO_TELEMETRY: '1'
